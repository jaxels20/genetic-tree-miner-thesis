name: fast-token-replay-wheels

on:
  push:
    branches: [main]
    tags: ["ftr-v*"]
    paths:
      - "src/FastTokenBasedReplay/**"
      - ".github/workflows/fast-token-replay-wheels.yml"
  pull_request:
    paths:
      - "src/FastTokenBasedReplay/**"
      - ".github/workflows/fast-token-replay-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp_tests:
    name: C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and run the GoogleTest suite
        working-directory: src/FastTokenBasedReplay
        run: |
          cmake -S . -B build -DFTR_BUILD_TESTS=ON -DFTR_BUILD_PYTHON=OFF
          cmake --build build -j 4
          # Combined prefix + suffix caching is not implemented yet, so its tests are excluded
          ctest --test-dir build --output-on-failure -E PrefixAndSuffixCaching

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: src/FastTokenBasedReplay
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_MACOS: x86_64 arm64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pipx run build --sdist --outdir dist src/FastTokenBasedReplay
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # Runs only for tags like ftr-v0.1.0 and uses PyPI trusted publishing (no API token)
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/ftr-v')
    needs: [cpp_tests, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
